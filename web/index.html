<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>秒开输入</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0F1117;
    --surface: #181B24;
    --border: #262B36;
    --text: #E4E7EC;
    --text-muted: #6B7280;
    --accent: #F0973B;
    --green: #4ADE80;
    --red: #F87171;
    --radius: 14px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    justify-content: center;
    padding: 16px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .app {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
  }

  /* ── Header row: title left · status right ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0 12px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
  }
  .header .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 500;
    transition: color 0.3s ease;
  }
  .header .status .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    transition: all 0.3s ease;
  }
  .header .status.on { color: var(--green); }
  .header .status.on .dot {
    background: var(--green);
    box-shadow: 0 0 7px rgba(74, 222, 128, 0.5);
  }
  .header .status.off { color: var(--text-muted); }
  .header .status.off .dot {
    background: var(--red);
    box-shadow: 0 0 5px rgba(248, 113, 113, 0.4);
  }

  /* ── Textarea ── */
  .input-wrap {
    position: relative;
    border-radius: var(--radius);
    background: var(--surface);
    border: 1.5px solid var(--border);
    transition: border-color 0.4s ease;
  }
  .input-wrap::after {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: var(--radius);
    z-index: -1;
    opacity: 0;
    background: linear-gradient(135deg, var(--accent), #F0C060);
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  .input-wrap.live { border-color: transparent; }
  .input-wrap.live::after {
    opacity: 1;
    animation: breathe 3s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.85; }
  }

  textarea {
    display: block;
    width: 100%;
    height: 180px;
    padding: 16px;
    font-family: inherit;
    font-size: 18px;
    line-height: 1.65;
    color: var(--text);
    background: transparent;
    border: none;
    border-radius: var(--radius);
    resize: none;
    outline: none;
    -webkit-user-select: text;
    user-select: text;
  }
  textarea::placeholder { color: #3D4352; }

  /* ── Spacer fills the gap ── */
  .spacer { flex: 1; min-height: 16px; }

  /* ── 模式切换（一行内：模式 + 开关 + 小字说明） ── */
  .mode-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0 4px;
  }
  .mode-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .mode-switch {
    display: flex;
    flex: 0 0 auto;
    gap: 3px;
    padding: 3px;
    border-radius: 10px;
    background: var(--surface);
    border: 1.5px solid var(--border);
  }
  .mode-btn {
    flex: 1;
    height: 34px;
    padding: 0 12px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .mode-btn.active {
    background: var(--accent);
    color: #0F1117;
  }
  .mode-hint {
    flex: 1;
    min-width: 0;
    font-size: 11px;
    line-height: 1.25;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Utility buttons ── */
  .utils {
    display: flex;
    padding: 8px 0;
  }
  .utils button {
    flex: 1;
    height: 48px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .utils button + button {
    margin-left: 8px;
  }
  .utils button:active {
    transform: scale(0.96);
    background: var(--border);
  }
  /* ── 发送按钮 ── */
  .utils .btn-send-top {
    border-color: var(--accent);
    color: var(--accent);
  }
  .utils .btn-send-top:active {
    background: var(--accent);
    color: #0F1117;
  }
  .utils .btn-backspace { border-color: #E56050; color: #E56050; }
  .utils .btn-backspace:active { background: #E56050; color: #fff; }

  /* ── 回车按钮（同行内绿色高亮） ── */
  .utils .btn-enter-row {
    background: #0D241A;
    border: 1.5px solid #4ADE80;
    color: #4ADE80;
    font-weight: 700;
  }
  .utils .btn-enter-row:active {
    background: #4ADE80;
    color: #0F1117;
  }

  @media (prefers-reduced-motion: reduce) {
    .input-wrap::after { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- Header: title + status -->
  <div class="header">
    <h1>秒开输入</h1>
    <div class="status off" id="status">
      <span class="dot"></span>
      <span id="statusText">等待连接</span>
    </div>
  </div>

  <!-- Input -->
  <div class="input-wrap" id="wrap">
    <textarea id="input" placeholder="开始输入..." autofocus></textarea>
  </div>

  <div class="spacer"></div>

  <!-- 模式切换：自动模式 / 手动模式 -->
  <div class="mode-row">
    <span class="mode-label">模式</span>
    <div class="mode-switch" id="modeSwitch" role="group" aria-label="发送模式">
      <button class="mode-btn active" data-mode="auto">自动模式</button>
      <button class="mode-btn" data-mode="manual">手动模式</button>
    </div>
    <span class="mode-hint" id="modeHint">输入后自动上屏并清空</span>
  </div>

  <!-- Action buttons: 发送 / 退格 / 回车 -->
  <div class="utils">
    <button id="btnSend" class="btn-send-top">发送</button>
    <button id="btnBackspace" class="btn-backspace">退格</button>
    <button id="btnEnter" class="btn-enter-row">回车</button>
  </div>
</div>

<script>
(function() {
  // ── DOM 引用 ──
  var input = document.getElementById('input');       // 输入框
  var wrap = document.getElementById('wrap');         // 输入框外层容器（用于呼吸灯动画）
  var statusEl = document.getElementById('status');   // 连接状态指示器
  var statusText = document.getElementById('statusText');

  // ── WebSocket 连接管理 ──
  var ws = null;                // WebSocket 连接实例
  var reconnectTimer = null;    // 自动重连定时器
  var connected = false;        // 当前是否已连接

  // 更新状态指示器的样式和文字
  // cls: 'on' | 'off' | 'err'
  function setStatus(cls, text) {
    statusEl.className = 'status ' + cls;
    statusText.textContent = text;
  }

  // 建立 WebSocket 连接到后端
  function connect() {
    var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(protocol + '//' + location.host + '/ws');

    // 连接成功：更新状态，开启输入框呼吸灯动画
    ws.onopen = function() {
      connected = true;
      wrap.classList.add('live');
      setStatus('on', '已连接');
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    };

    // 连接断开：关闭呼吸灯，3 秒后自动重连
    ws.onclose = function() {
      connected = false;
      wrap.classList.remove('live');
      setStatus('off', '已断开');
      ws = null;
      scheduleReconnect();
    };

    // 连接出错
    ws.onerror = function() {
      setStatus('err', '连接失败');
    };
  }

  // 自动重连：3 秒后尝试重新连接，避免频繁重连
  function scheduleReconnect() {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(function() {
      reconnectTimer = null;
      connect();
    }, 3000);
  }

  // ── 文本发送控制 ──
  var composing = false;        // 是否处于输入法组合状态（中文/语音输入）
  var lastSent = '';            // 上次成功发送的内容，用于去重
  var debounceTimer = null;     // 键盘输入防抖定时器

  // ── 模式切换：auto=自动发送后清屏 / manual=手动发送后清屏 ──
  var mode = 'auto';
  try { mode = localStorage.getItem('mkinput_mode') || 'auto'; } catch(e) {}
  var autoSend = mode === 'auto';

  var modeSwitch = document.getElementById('modeSwitch');
  var modeBtns = modeSwitch.querySelectorAll('.mode-btn');
  var modeHint = document.getElementById('modeHint');

  function applyMode() {
    autoSend = mode === 'auto';
    modeBtns.forEach(function(b) {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
    modeHint.textContent = autoSend ? '输入后自动上屏并清空' : '点击"发送"后上屏并清空';
    try { localStorage.setItem('mkinput_mode', mode); } catch(e) {}
  }
  modeBtns.forEach(function(b) {
    b.addEventListener('click', function() {
      if (b.dataset.mode === mode) return;
      mode = b.dataset.mode;
      applyMode();
    });
  });
  applyMode();

  // 发送成功后清空输入框，并通知后端重置去重基准（下一段内容以追加方式上屏）
  function clearAfterSend() {
    input.value = '';
    lastSent = '';
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send('__CLEARED__');
    }
    focusInput();
  }

  // 核心发送函数：通过 WebSocket 将文本发送到后端
  // 命令类消息（以 __ 开头）不走去重逻辑
  function send(text) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    var t = text || input.value;
    if (!t) return;
    // 普通文本（非命令）如果内容和上次相同则跳过
    if (t.substring(0, 2) !== '__' && t === lastSent) return;
    ws.send(t);
    lastSent = t;
    setStatus('on', '已发送 ✓');
    setTimeout(function() { setStatus('on', '已连接'); }, 1200);
  }

  // 发送输入框当前全部内容
  function sendText() {
    send(input.value);
  }

  // ── 输入事件监听 ──

  // 输入法开始组合（语音识别 / 拼音选词）：暂停自动发送
  input.addEventListener('compositionstart', function() {
    composing = true;
    if (debounceTimer) { clearTimeout(debounceTimer); debounceTimer = null; }
  });

  // 输入法组合结束（确认文字）：300ms 后自动发送
  // 适用于语音输入识别完成、或输入法选字确认
  input.addEventListener('compositionend', function() {
    composing = false;
    if (debounceTimer) { clearTimeout(debounceTimer); debounceTimer = null; }
    var text = input.value.trim();
    if (text && autoSend) {
      setTimeout(function() {
        if (!composing && input.value) {
          sendText();
          clearAfterSend();
        }
      }, 300);
    }
  });

  // 键盘输入（非组合状态）：停止打字 800ms 后自动发送
  // 防抖避免每打一个字就发送一次
  input.addEventListener('input', function() {
    if (composing || !autoSend) return;
    if (debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function() {
      debounceTimer = null;
      if (!input.value) return;
      sendText();
      clearAfterSend();
    }, 800);
  });

  // ── 按钮事件绑定 ──

  // 发送：手动发送完整内容到电脑（两种模式都可用），发送后清空输入框
  document.getElementById('btnSend').addEventListener('click', function() {
    if (!input.value) return;
    sendText();
    clearAfterSend();
  });

  // 退格：删除手机输入框最后一个字符，并向电脑发送一次退格（唯一显式删除操作）
  document.getElementById('btnBackspace').addEventListener('click', function() {
    var v = input.value;
    if (v) {
      var runes = Array.from(v);
      runes.pop();
      input.value = runes.join('');
    }
    send('__BACKSPACE__');
    focusInput();
  });

  // 发送回车：通知后端按回车，清空输入框
  document.getElementById('btnEnter').addEventListener('click', function() {
    send('__ENTER__');
    input.value = '';
    lastSent = '';
    focusInput();
  });

  // 点击空白区域自动聚焦输入框（弹出键盘）
  // 连上鼠标时 Android 可能不弹键盘，需额外触发 selection 来唤起
  function focusInput() {
    input.focus();
    // 强制设置选区，Android 连鼠标时帮助唤起键盘
    try { input.setSelectionRange(input.value.length, input.value.length); } catch(e) {}
  }

  // Android WebView 会在右键事件结束后继续执行“返回并收起键盘”，
  // 同步 focus() 会被覆盖，因此先失焦，再等系统动作结束后重新聚焦。
  function reopenKeyboard() {
    input.blur();
    setTimeout(function() {
      focusInput();
      // 切换 inputmode，促使旧版 Android WebView 重新创建软键盘连接
      input.setAttribute('inputmode', 'none');
      input.offsetHeight;
      input.setAttribute('inputmode', 'text');
      focusInput();
      if (navigator.virtualKeyboard && navigator.virtualKeyboard.show) {
        try { navigator.virtualKeyboard.show(); } catch(e) {}
      }
    }, 120);
  }

  document.addEventListener('click', function(e) {
    // 点到输入框、按钮、滑块时忽略
    if (e.target.tagName === 'TEXTAREA') return;
    if (e.target.tagName === 'BUTTON') return;
    if (e.target.closest('.mode-switch') !== null) return;
    focusInput();
  });

  // ── 键盘弹出时压缩中间空白区，保持顶部固定 ──
  // 小米 Edge 浏览器弹出键盘后页面不压缩（键盘覆盖而非上推），底部按钮被挡住。
  // 方案：键盘弹出时把中间的 .spacer 压缩到最小高度 16px，
  // 底部按钮自然上移进入可视区，顶部 header 和输入框不受影响。
  if (window.visualViewport) {
    var spacerEl = document.querySelector('.spacer');
    // 记录键盘收起时的视口高度（作为基准）
    var fullHeight = window.visualViewport.height;

    function onViewportChange() {
      var vh = window.visualViewport.height;
      // 始终保持基准为最大值（旋转屏幕等场景下更新）
      if (vh > fullHeight) fullHeight = vh;
      if (vh < fullHeight - 60) {
        // 键盘弹出：压缩 spacer，把按钮推上去
        spacerEl.style.flex = '0 0 16px';
      } else {
        // 键盘收起：恢复 spacer
        spacerEl.style.flex = '';
      }
    }

    window.visualViewport.addEventListener('resize', onViewportChange);
    // 输入框聚焦时也检查一次（某些浏览器可能不触发 resize）
    input.addEventListener('focus', function() {
      setTimeout(onViewportChange, 200);
    });
  }

  // ── 鼠标右键 / 侧键返回 → 改为发送回车 ──
  // Logitech MX Master 3S 在 Android 上按右键/侧键触发系统返回。
  // contextmenu 拦截右键菜单，popstate 兜住系统返回导致的页面后退。

  // 1. 右键菜单 → 发送回车
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    if (connected) {
      send('__ENTER__');
      input.value = '';
      lastSent = '';
      // 保持在右键事件的用户手势内重新唤起软键盘
      reopenKeyboard();
    }
  });

  // 2. 系统返回 → 留在当前页 + 发送回车
  //    每次回退时 push 新状态，阻止浏览器离开页面
  window.addEventListener('popstate', function() {
    history.pushState(null, '', location.href);
    if (connected) {
      send('__ENTER__');
      input.value = '';
      lastSent = '';
      focusInput();
    }
  });
  // 初始状态，给 popstate 第一次拦截的机会
  history.pushState(null, '', location.href);

  // 启动
  connect();
})();
</script>
</body>
</html>
